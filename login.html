<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect - Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="../index/index.html" class="logo">CampusConnect</a>
    <a href="../index/index.html">Home</a>
    <a href="login.html" class="nav-btn">Log in</a>
  </nav>

  <main class="auth-card">
    <h1>Welcome back!</h1>
    <p class="intro">Enter your details to try the CampusConnect demo.</p>

    <div class="demo-note">
      This is a practice page, not real account security. Any email and non-empty
      password will work. Your password is never saved or logged.
    </div>

    <form id="login-form">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username"
             placeholder="you@college.edu" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button type="submit">Log in</button>
      <p id="login-message" class="message" role="status" aria-live="polite"></p>
    </form>

    <p class="back-link"><a href="../index/index.html">Back to home</a></p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
